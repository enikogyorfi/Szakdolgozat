page:
  layout: portrait
  format: A4
  margin: [2.5cm, 2.5cm, 2.5cm, 2.5cm] # [fent, kint, lent, bent]
base:
  font_size: 12
  line_height_length: 1.3 # Sorköz beállítása
role:
  # Itt definiáljuk a képnél látott stílust (Bold cím, Italic törzs)
  definition:
    font_style: italic
  theorem:
    font_style: italic
  assertion:
    font_style: italic
  proof:
    border_left_width: 0
    margin: [10, 0, 10, 0]
  university:
    font_size: 16
    font_style: normal
    text_transform: uppercase
  faculty:
    font_size: 14
    font_style: normal
    text_transform: uppercase
  author-name:
    font_size: 18
    margin_top: 40
  thesis-title:
    font_size: 22
    font_style: bold
    text_transform: uppercase
  supervisor-name:
    font_style: bold